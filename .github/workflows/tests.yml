name: LoopGrid LangGraph Integration CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10','3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e '.[test,persistence-test]'
      - name: Unit and security suite
        run: python -m pytest -v --cov=loopgrid_langgraph --cov-fail-under=90
      - name: Native installed LangGraph graph + interrupt/resume
        run: python scripts/langgraph_runtime_e2e.py
      - name: Native SQLite persistent checkpoint restart and resume
        run: python scripts/persistent_langgraph_e2e.py
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Build distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python scripts/check_dist.py
  consumer-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Fresh virtualenv built-wheel consumer
        shell: bash
        run: |
          python -m venv /tmp/loopgrid-langgraph-consumer
          /tmp/loopgrid-langgraph-consumer/bin/python -m pip install dist/*.whl
          /tmp/loopgrid-langgraph-consumer/bin/python -c "from loopgrid_langgraph import LangGraphBridge, CoreClient; import langgraph; print('PASS: consumer import')"
