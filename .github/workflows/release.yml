# Activate ONLY after RC validation, exact tag and PyPI Trusted Publisher registration.
name: Publish LoopGrid LangGraph to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    # Explicit opt-in after verified CI, PyPI Trusted Publisher and environment setup.
    if: vars.LOOPGRID_PYPI_PUBLISH_ENABLED == 'true' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Version/tag correspondence
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import os,tomllib; expected='v'+tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']==expected, (os.environ['RELEASE_TAG'], expected)"
      - run: python -m build
      - run: python scripts/check_dist.py
      - uses: pypa/gh-action-pypi-publish@release/v1
