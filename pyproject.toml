[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgrid-langgraph"
version = "0.1.0"
description = "Native LangGraph decision evidence, application policy, human-review gates and signed verification for LoopGrid"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "LoopGrid"}]
keywords = ["langgraph", "langchain", "ai-agents", "agent-governance", "decision-evidence", "audit-trail", "policy", "human-in-the-loop", "ed25519"]
classifiers = [
  "Development Status :: 4 - Beta", "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers", "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["langgraph>=1.2.12,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2", "twine>=6,<8", "tomli>=2; python_version < '3.11'"]
persistence-test = ["langgraph-checkpoint-sqlite>=3.0,<4"]

[project.urls]
Homepage = "https://loopgrid.io/"
Documentation = "https://loopgrid.io/docs/"
Repository = "https://github.com/loopgridio/loopgrid-langgraph"
Issues = "https://github.com/loopgridio/loopgrid-langgraph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
